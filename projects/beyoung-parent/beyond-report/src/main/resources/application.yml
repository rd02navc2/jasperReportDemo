server:
  port: 8095
  address: 127.0.0.1
  # ===== 新增：JSP 用的 Session 設定 =====
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        # 若已是 HTTPS 環境，建議額外打開：
        # secure: true
        # same-site: lax

download:
  content:
    root: C:/Users/davidchung/Documents/開發用/assets/upload

upload:
  content:
    root: C:/Users/davidchung/Documents/開發用/assets/upload

# 原有的 URL 設定
ERP_WS_URL: "http://localhost:8080"
TS_API_URL: "https://localhost:8081"
NCCC_API_URL: "https://localhost:8082"
OneOnAir_EC_Notify_URL: "http://localhost:8095/Surrounding/your-mock-path"

nccc_payment_dir: C:/nccc/payment

# 營業報表實體圖檔存放目錄
Notify_Image_Dir: "C:/path/to/your/images"
# 新增：推播圖檔所需的對外公開 HTTPS 基礎網址前綴 (請替換為你們的真實網址)
Public_Image_Base_Url: "https://yourdomain.com/static/revenue/"

# AI 機器人與 LINE 相關的配置
api-config:
  openai:
    url: "https://api.openai.com/v1/chat/completions"
    access-token: "sk-proj-xxxx..." # 替換成真實的 OpenAI API Key
    model: "gpt-4o"
  line:
    reply-url: "https://api.line.me/v2/bot/message/reply"
    push-url: "https://api.line.me/v2/bot/message/push" # 新版 LINE Messaging API 主動推播網址
    channel-access-token: "eyJhbGciOi..." # 替換成 LINE Developers 後台發行的 Channel Access Token
    it-robot-token: "YOUR_IT_ROBOT_CHANNEL_ACCESS_TOKEN"
    work-robot-token: "YOUR_WORK_ROBOT_CHANNEL_ACCESS_TOKEN"
    # 配置 4 種報表類型各自對應的 LINE 接收端 ID (群組 ID 或使用者 User ID)
    target-id:
      pre-revenue: "Uxxxxxxxxxxxxxxx_A"   # A: 永和營業報表預派 接收端 ID
      real-revenue: "Cxxxxxxxxxxxxxxx_BC" # B & C: 永和/影城營業報表 接收端 ID
      sales: "Uxxxxxxxxxxxxxxx_D"        # D: 每日打烊業績快報 接收端 ID
  one-on-air:
    api-url: "https://api.example.com" # 填入真正的金流 API Base URL
    merchant-id: "YOUR_MERCHANT_ID"
    api-key: "YOUR_API_KEY"
    return-url: "https://yourdomian.com/return"
    cancel-url: "https://yourdomian.com/cancel"
    confirm-url: "https://yourdomian.com/confirm"
    notify-url: "https://yourdomian.com/notify"
    result-url: "https://your-domain.com/result"
    successUrl: "https://your-domain.com/success"
    failUrl:    "https://your-domain.com/fail"

app:
  server:
    url: ${APP_SERVER_URL:http://localhost:8099/PrivilegeWebService}

subscript:
  target: "https://api.example.com/v1"
  content-type: "application/json"
  key: "your_hmac_secret_key_here"
  app-id: "你的AppId"

chiefpay:
  api:
    url: http://localhost:8098/Surrounding/rest
  parking:
    url: http://unknown-external-parking-api.com

onepay:
  payment-target: https://unknown

pxpay:
  payment-target: https://api.pxpay.example.com.tw
  config:
    content-type: application/json
    mer-code: ${PXPAY_MER_CODE:unknown}
    mer-en-name: ${PXPAY_MER_EN_NAME:unknown}
    key: ${PXPAY_SECRET_KEY:unknown}

taiwanpay:
  payment-target: https://api.taiwanpay.com.tw
  merchant-id: ${TAIWANPAY_MERCHANT_ID:unknown}
  terminal-id: ${TAIWANPAY_TERMINAL_ID:unknown}
  key: ${TAIWANPAY_SECRET_KEY:unknown}
  content-type: application/json

linepay:
  channel-id: ${LINEPAY_CHANNEL_ID:unknown}
  authorization-key: ${LINEPAY_CHANNEL_SECRET:unknown}
  payment-target: https://sandbox-api-pay.line.me

pacepay:
  timeout: 30000
  expiring-at: 60000
  currency: TWD
  refund-justification: POS_SYSTEM_REFUND
  payment-target-base: https://playground.api.pacepay.com
  refunds-target: https://playground.api.pacepay.com/v1/refunds
  playground-client-id: "your_actual_client_id_here"
  playground-client-secret: "your_actual_client_secret_here"

GIFT_WS_URL: ${GIFT_SERVICE_URL:http://localhost:8095/GiftWebService}

parking:
  url: http://api.parking-system.com

APPServer: ${app.server.url}

spring:
  application:
    name: beyond-report

  threads:
    virtual:
      enabled: true

  # ===== 新增：JSP View Resolver =====
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  datasource:
    primary:
      url: jdbc:mysql://localhost:3306/reportdb?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      username: root
      password: abcd@1234
      driver-class-name: com.mysql.cj.jdbc.Driver

    secondary:
      url: jdbc:mysql://localhost:3306/permissiondb?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      username: root
      password: abcd@1234
      driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        auto_quote_keyword: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      giftServiceClient:
        connectTimeout: 30000
        readTimeout: 120000
        loggerLevel: full

logging:
  level:
    com.beyond.member: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
