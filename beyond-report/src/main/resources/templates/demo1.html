<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>報表管理系統</title>

    <!-- EasyUI & zTree CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/easyui/themes/default/easyui.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/easyui/themes/icon.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/zTreeStyle/zTreeStyle.css}">

    <!-- JS 套件 -->
    <script type="text/javascript" th:src="@{/jquery/jquery-1.9.1.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery/jquery.easyui.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery/jquery.ztree.core-3.5.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery/jquery.ztree.excheck-3.5.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery/jquery.cookie.js}"></script>

    <script type="text/javascript">
        // 新增頁籤 (Tab)
        function addTab(title, myHTML, canRead, canInsert, canSave, canDelete, canPrint, funcid) {
            if ($('#content').tabs('exists', title)) {
                $('#content').tabs('select', title);
            } else {
                var content;
                if (title.indexOf('首頁') !== -1) {
                    content = "<iframe frameborder='0' scrolling='yes' width='100%' height='100%' src='" + myHTML + "'></iframe>";
                } else {
                    var queryParams = "?funcid=" + funcid + 
                                      "&canRead=" + canRead + 
                                      "&canInsert=" + canInsert + 
                                      "&canSave=" + canSave + 
                                      "&canDelete=" + canDelete + 
                                      "&canPrint=" + canPrint;
                    content = "<iframe frameborder='0' scrolling='yes' width='100%' height='100%' src='" + myHTML + queryParams + "'></iframe>";
                }

                $('#content').tabs('add', {
                    title: title,
                    content: content,
                    closable: true
                });
            }
        }

        $(document).ready(function() {
            // 讀取登入帳號（可優先從 Thymeleaf Session/Model 拿，若無則從 Cookie 讀取）
            var username = $.cookie("COOKIE_LOGIN_USERNAME");
            if (username) {
                $("#login_id").text(username);
            }

            // zTree 設定
            var setting = {
                data: {
                    key: {
                        title: "title"
                    },
                    simpleData: {
                        enable: true
                    }
                },
                callback: {
                    beforeClick: function(treeId, treeNode, clickFlag) {},
                    onClick: function(event, treeId, treeNode, clickFlag) {
                        if (treeNode.program_name && treeNode.program_name.indexOf('http') === 0) {
                            window.open(treeNode.program_name, '_blank');
                        } else if (treeNode.pId !== null) {
                            addTab(treeNode.name, treeNode.program_name, treeNode.canRead, treeNode.canInsert, treeNode.canSave, treeNode.canDelete, treeNode.canPrint, treeNode.id);
                        }
                    }
                }
            };

            // 取得使用者選單功能（對接 Spring Boot API）
            $.ajax({
                url: "api/user-functions", // 建議改為 RESTful API 路由
                type: 'POST',
                data: { "process": "getUserFunction" },
                dataType: 'json',
                success: function(data) {
                    if (data && data.UserFunction) {
                        $.fn.zTree.init($("#treeDemo"), setting, data.UserFunction);
                    }
                },
                error: function(xhr, textStatus, thrownError) {
                    $.messager.alert('錯誤視窗', "菜單加載失敗: " + xhr.responseText, "error");
                }
            });
        });

        // 登出功能
        function doLogout() {
            $.ajax({
                url: "api/logout", // 建議改為 Spring Boot 登出路由
                type: 'POST',
                data: { 'process': 'logout' },
                dataType: 'json',
                success: function(data) {
                    if (data && data.Success === 'Y') {
                        $.messager.alert('訊息視窗', '系統已登出', "info", function() {
                            // 清除 Cookie 並導回登入頁
                            $.removeCookie("COOKIE_LOGIN_USERNAME", { path: '/' });
                            window.location.href = "login"; 
                        });
                    } else {
                        $.messager.alert('警告視窗', '登出失敗', "warning");
                    }
                },
                error: function(xhr, textStatus, thrownError) {
                    $.messager.alert('錯誤視窗', "登出異常: " + xhr.responseText, "error");
                }
            });
        }

        // 時鐘顯示
        function showTime() {
            var nowDate = new Date();
            var d = nowDate.getDay();
            var dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            document.getElementById('showbox').innerHTML = '目前時間：' + nowDate.toLocaleString() + '（' + dayNames[d] + '）';
            setTimeout(showTime, 1000);
        }
    </script>
</head>

<body onload="showTime()">
    <div id="cc" class="easyui-layout" data-options="fit:true" style="margin:0px;">
        
        <!-- 頁眉 (North) -->
        <div data-options="region:'north',title:''" style="height:70px; overflow:hidden;">
            <div style="padding:10px 0px 0px 10px; float:left;">
                <img th:src="@{/image/logo2.jpg}" alt="Logo" />
            </div>
            <div style="font-size:16px; position:absolute; right:20px; bottom:10px;">
                <!-- 可直接透過 Thymeleaf 讀取 Session 中的使用者名稱，或由 JS 填入 -->
                <span id="login_id" th:text="${session.LOGIN_USER != null ? session.LOGIN_USER : ''}"></span> 您好，
                <span id="showbox"></span>
                <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-logout'" onclick="doLogout();">登出</a>
            </div>
        </div>

        <!-- 左側功能選單 (West) -->
        <div data-options="region:'west', split:true, hideCollapsedContent:false, collapsed:false, title:'功能選項'" style="width:240px;">
            <div id="treeDemo" class="ztree"></div>
        </div>

        <!-- 中央主內容區 (Center) -->
        <div data-options="region:'center',title:''">
            <div id="content" class="easyui-tabs" data-options="fit:true,border:false"></div>
        </div>

    </div>
</body>
</html>
