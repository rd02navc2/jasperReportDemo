<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>報表管理系統 - 登入</title>
    <meta name="googlebot" content="noarchive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">

    <!-- 使用 Thymeleaf 引入 CSS 檔案 -->
    <link rel="stylesheet" th:href="@{/css/jquery-ui-1.10.3.custom/themes/smoothness/jquery-ui.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/easyui/themes/default/easyui.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/easyui/themes/icon.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/Frame.css}">

    <!-- 使用 Thymeleaf 引入 JS 檔案 -->
    <script th:src="@{/jquery/jquery-1.9.1.min.js}" type="text/javascript"></script>
    <script th:src="@{/jquery/jquery-ui-1.10.3.custom.js}" type="text/javascript"></script>
    <script th:src="@{/jquery/jquery.easyui.min.js}" type="text/javascript"></script>
    <script th:src="@{/jquery/jquery.form.js}" type="text/javascript"></script>
    <script th:src="@{/jquery/jquery.blockUI.js}" type="text/javascript"></script>
    <script th:src="@{/jquery/jquery.cookie.js}" type="text/javascript"></script>

    <script type="text/javascript"> 
        $(document).ready(function() { 
            $('#myForm').submit(function() { 
                var options = { 
                    url: 'api/login', // 改為 Spring Boot REST API 路由
                    type: 'post', 
                    dataType: 'json', 
                    data: {
                        'userid': $("#userid").val(), 
                        'password': $("#password").val()
                    },
                    beforeSubmit: beforeSubmit, 
                    success: successSubmit,
                    error: function(xhr, ajaxOptions, thrownError){
                        $.unblockUI();
                        $(".blockUI").fadeOut("slow"); 
                        $.messager.alert('錯誤視窗', xhr.responseText || '系統執行錯誤', "error");
                    }
                }; 
                
                $(this).ajaxSubmit(options); 
                return false; 
            });

            // 讀取 Cookie 自動帶入帳號密碼
            $("#userid").val($.cookie("COOKIE_LOGIN_USERNAME"));
            $("#password").val($.cookie("COOKIE_LOGIN_PASSWD"));
        }); 

        function beforeSubmit(formData, jqForm, options) { 
            if (jqForm.form('validate')){
                $.blockUI({
                    message: "<div style='font-size:18px;font-weight:bold'>系統登入中，請稍候....</div>", 
                    css: { 
                        border: 'none', 
                        padding: '15px', 
                        backgroundColor: '#000', 
                        '-webkit-border-radius': '10px', 
                        '-moz-border-radius': '10px', 
                        opacity: .5, 
                        color: '#fff' 
                    } 
                }); 
            }
            return jqForm.form('validate'); 
        } 

        // post-submit callback 
        function successSubmit(responseText, statusText, xhr, $form) { 
            // 解除 UI 遮罩
            $.unblockUI();
            $(".blockUI").fadeOut("slow"); 
            
            // 判斷後端回傳結果
            if (responseText && responseText.Success === 'Y') {
                // 1. 記錄 Cookie (有效期限 7 天，全站有效)
                var username = $("#userid").val();
                if (username) {
                    $.cookie("COOKIE_LOGIN_USERNAME", username, { expires: 7, path: '/' });
                }
                
                // 2. 登入成功，跳轉頁面 (導向 demo1.html 或 Spring Boot 路由)
                window.location.href = "demo1"; 
            } else {
                // 3. 登入失敗，顯示警告視窗
                var errorMsg = (responseText && responseText.LoginMsg) ? responseText.LoginMsg : '登入失敗，請確認帳號密碼';
                $.messager.alert('警告視窗', errorMsg, "warning"); 
            }
        }
    </script> 
</head>
<body leftmargin="0" scroll="no" topmargin="0">
    <table border="0" cellspacing="0" cellpadding="0" width="100%" height="100%">
        <tbody>
            <tr>
                <td align="center">
                    <table border="0" cellspacing="0" cellpadding="0" width="100%">
                        <tbody>
                            <tr>
                                <td style="padding: 6px;" height="66" valign="bottom" align="right">
                                    <img th:src="@{/image/logo2.jpg}" alt="Logo 1">
                                </td>
                                <td valign="bottom" width="30%">
                                    <img th:src="@{/image/logo_new.png}" width="351" height="63" alt="Logo 2">
                                </td>
                                <td>&nbsp;</td>
                            </tr>
                            <tr>
                                <td bgcolor="#9699e0" width="50%" align="right">
                                    <img th:src="@{/image/loginbgleft.jpg}" width="381" height="190" alt="Background Left">
                                </td>
                                <td style="padding: 6px;" bgcolor="#acaedb" align="center">
                                    <form id="myForm">
                                        <table border="0" cellspacing="0" cellpadding="0" width="300">
                                            <tbody>
                                                <tr>
                                                    <td width="1">
                                                        <img th:src="@{/image/lcornerleft.jpg}" width="13" height="142" alt="Corner Left">
                                                    </td>
                                                    <td bgcolor="#bdbee2">
                                                        <table border="0" cellspacing="0" cellpadding="3" width="100%">
                                                            <tbody>
                                                                <tr>
                                                                    <td colspan="2" align="center"><span id="lblMessage"></span></td>
                                                                </tr>
                                                                <tr>
                                                                    <td style="width: 73px;"><span id="lblLogonName">帳號:</span></td>
                                                                    <td>
                                                                        <input style="background-color: white; width: 218px;" id="userid" class="Underline_Field" name="userid">
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td style="width: 73px;"><span id="lblPassword">密碼:</span></td>
                                                                    <td>
                                                                        <input style="background-color: white; width: 218px;" id="password" class="Underline_Field" type="password" name="password">
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td height="25" valign="middle" colspan="2" align="center">
                                                                        <span style="color: indigo; font-size: 12px;" id="lblLoginMessage">請使用與網域相同之帳號與密碼</span>
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td>&nbsp;</td>
                                                                    <td>
                                                                        <input id="btnLogon" value="登入" type="submit" name="btnLogon">&nbsp;&nbsp;
                                                                        <input id="btnClear" value="清除" type="reset" name="btnClear">
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                    <td width="1">
                                                        <img th:src="@{/image/lcornerright.jpg}" width="13" height="142" alt="Corner Right">
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                        <input type="hidden" name="process" value="login" />
                                        <input type="hidden" name="auto" value="N" />
                                    </form>
                                </td>
                                <td style="border-left: #ffffff 1px solid;" bgcolor="#9699e0"></td>
                            </tr>
                        </tbody>
                    </table>
                    <p>比漾廣場版權所有 Copyright &copy; Beyond Plaza Corporation Limited. All Rights Reserved.</p>
                    <p>&nbsp;</p>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
